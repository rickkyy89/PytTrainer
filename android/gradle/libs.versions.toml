# Catalogo delle versioni (Gradle Version Catalog): tutte le versioni delle
# dipendenze/plugin del progetto Android in un unico posto, per evitare
# numeri di versione sparsi nei vari build.gradle.kts. Riferimento nei
# moduli: "libs.<alias>" (dipendenze) e "libs.plugins.<alias>" (plugin).

[versions]
# --- Toolchain e plugin di build ---
agp = "8.13.2"                    # Android Gradle Plugin (Chaquopy 17 supporta 7.3.x-9.2.x)
kotlin = "2.1.21"                 # Kotlin, incluso il plugin Compose Compiler della stessa versione
chaquopy = "17.0.0"                # Runtime Python embedded (Maven Central)
ksp = "2.1.21-2.0.1"              # non usato direttamente ora, riservato per eventuali processor futuri

# --- AndroidX di base ---
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"

# --- Compose ---
composeBom = "2025.06.01"

# --- Navigazione, media, background, sicurezza, immagini, serializzazione ---
navigationCompose = "2.8.5"
media3 = "1.5.0"
workManager = "2.10.0"
securityCrypto = "1.1.0"
coilCompose = "2.7.0"
kotlinxSerializationJson = "1.7.3"

# --- OAuth (login Google interattivo lato Android) ---
appauth = "0.11.1"

# --- Test (scaffolding minimo, non ampliato in questa fase) ---
junit = "4.13.2"
androidxTestJunit = "1.2.1"
espressoCore = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# Dichiarato esplicitamente (non solo transitivo da core-ktx) per
# androidx.core.app.NotificationCompat, usata da GenerazioneDocumentoWorker
# per la notifica di avanzamento (Fase 7): stesso motivo/convenzione di
# androidx-lifecycle-viewmodel-compose qui sotto.
androidx-core = { group = "androidx.core", name = "core", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# Fornisce viewModel() nei Composable. Arriverebbe anche in modo transitivo da
# navigation-compose, ma dichiararlo esplicitamente evita che un cambio di
# versione della navigazione faccia sparire un'API che usiamo direttamente.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
