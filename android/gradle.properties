# Impostazioni globali di Gradle per il progetto Android di PytTrainer.

# Dimensione heap della JVM di Gradle (build non banale: Chaquopy impacchetta
# un intero interprete Python + pip install delle dipendenze).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX obbligatorio per tutte le librerie usate (Compose, Media3, ecc.).
android.useAndroidX=true

# Jetifier non serve: nessuna dipendenza legacy (pre-AndroidX) nel progetto.
android.enableJetifier=false

# Versione major.minor di Python richiesta da Chaquopy: DEVE corrispondere
# alla versione di Python installata sulla macchina che esegue la build
# (Chaquopy usa l'interprete host per il pip install delle dipendenze durante
# la build, poi impacchetta il runtime Python per il device). Letta da
# app/build.gradle.kts per configurare chaquopy.defaultConfig.version, così
# la versione è definita in un unico posto.
pyttrainer.python.version=3.11

# Kotlin: usa il compiler Kotlin incrementale e i daemon condivisi (default
# consigliato per progetti con Compose).
kotlin.code.style=official

# Client ID OAuth "Android" per il login Google (AppAuth) usato da
# GestoreAccessoGoogle. Da creare su Google Cloud Console > Credenziali > ID
# client OAuth > tipo "Android", con:
#   - nome pacchetto: com.pyttrainer.android
#   - impronta SHA-1: 59:50:55:5A:D7:D4:FB:B1:43:02:8F:D5:88:25:A4:31:89:5A:A0:86
#     (impronta del keystore di debug condiviso android/keystore/debug.keystore,
#     vedi il commento sopra signingConfigs in app/build.gradle.kts)
# Vuoto di default: senza un client configurato l'app compila comunque ma
# GestoreAccessoGoogle.configurato() torna false, così la UI spiega cosa
# manca invece di aprire un browser destinato a fallire.
pyttrainer.oauth.clientId=830165390494-6dtv27p78i5dpdoed24pel15sl25akkr.apps.googleusercontent.com

# Schema dell'URI di redirect OAuth (placeholder ${appAuthRedirectScheme}
# richiesto dal manifest della libreria AppAuth). NON va impostato a mano in
# condizioni normali: app/build.gradle.kts lo DERIVA automaticamente da
# pyttrainer.oauth.clientId (un client ID "123-abc.apps.googleusercontent.com"
# corrisponde sempre allo schema invertito "com.googleusercontent.apps.123-abc"),
# proprio per evitare che le due proprietà finiscano scollegate (causa
# classica di redirect_uri_mismatch silenzioso quando si cambia client ID e
# ci si scorda di aggiornare lo schema a mano).
#
# Il valore qui sotto resta come segnaposto SOLO quando pyttrainer.oauth.clientId
# è vuoto, giusto per permettere alla build di compilare prima di aver creato
# il client OAuth. Non richiede alcuna azione da parte tua: valorizza
# pyttrainer.oauth.clientId sopra e lo schema si aggiorna da solo.
pyttrainer.oauth.redirectScheme=com.pyttrainer.android
