# Impostazioni globali di Gradle per il progetto Android di PytTrainer.

# Dimensione heap della JVM di Gradle (build non banale: Chaquopy impacchetta
# un intero interprete Python + pip install delle dipendenze).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX obbligatorio per tutte le librerie usate (Compose, Media3, ecc.).
android.useAndroidX=true

# Jetifier non serve: nessuna dipendenza legacy (pre-AndroidX) nel progetto.
android.enableJetifier=false

# Versione major.minor di Python richiesta da Chaquopy: DEVE corrispondere
# alla versione di Python installata sulla macchina che esegue la build
# (Chaquopy usa l'interprete host per il pip install delle dipendenze durante
# la build, poi impacchetta il runtime Python per il device). Letta da
# app/build.gradle.kts per configurare chaquopy.defaultConfig.version, così
# la versione è definita in un unico posto.
pyttrainer.python.version=3.11
# Se questo interprete non è nel PATH della tua macchina, vedi
# app/build.gradle.kts (blocco chaquopy.defaultConfig, riga "buildPython")
# e android/README.md, sezione "Prerequisiti".

# Kotlin: usa il compiler Kotlin incrementale e i daemon condivisi (default
# consigliato per progetti con Compose).
kotlin.code.style=official

# Client ID OAuth di tipo "Android" (Google Cloud Console > API e servizi >
# Credenziali > Crea credenziali > ID client OAuth > Android), specifico del
# TUO progetto Google Cloud: NON è lo stesso client ID "Applicazione desktop"
# usato dalla versione Python a riga di comando. Lasciato vuoto qui di
# proposito: senza un valore il progetto compila comunque (vedi
# app/build.gradle.kts, che espone questa proprietà come BuildConfig.CLIENT_ID_OAUTH
# con default sicuro), ma l'accesso Google nell'app fallisce con un messaggio
# che rimanda alle istruzioni in android/README.md finché non lo valorizzi.
# Se preferisci non toccare un file tracciato da git, imposta la stessa
# proprietà in android/local.properties (vedi local.properties.esempio):
# quel file ha la precedenza su questo ed è escluso da .gitignore.
pyttrainer.oauth.clientId=
